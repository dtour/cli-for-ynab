name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.22"
          python-version: "3.12"
      - run: uv sync --locked --no-editable
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Build release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run scripts/release_assets.py --tag "$RELEASE_TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz
          dist/cli-for-ynab.rb dist/SHA256SUMS
          --verify-tag --title "CLI for YNAB $RELEASE_TAG"
          --notes-file "docs/releases/$RELEASE_TAG.md"
