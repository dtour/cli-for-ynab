name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    uses: ./.github/workflows/check.yml
  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.22"
          python-version: "3.12"
      - run: uv sync --locked --no-editable
      - name: Build release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run scripts/release_assets.py --tag "$RELEASE_TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz
          dist/cli-for-ynab.rb dist/SHA256SUMS
          --verify-tag --title "CLI for YNAB $RELEASE_TAG"
          --notes-file "docs/releases/$RELEASE_TAG.md"
