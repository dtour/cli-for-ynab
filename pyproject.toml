[project]
name = "cli-for-ynab"
version = "0.2.1"
description = "A predictable JSON CLI for YNAB, built for people and agents"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "dtour", email = "dhiraj.tourani@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.6,<26",
    "platformdirs>=4,<5",
    "pydantic>=2.12,<3",
    "typer>=0.27.2,<0.28",
    "urllib3>=2.1,<3",
    "ynab==4.4.0",
]

[project.scripts]
ynab = "ynab_cli.cli:main"

[project.urls]
Homepage = "https://github.com/dtour/cli-for-ynab"
Issues = "https://github.com/dtour/cli-for-ynab/issues"
Changelog = "https://github.com/dtour/cli-for-ynab/releases"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ynab_cli"]

[tool.hatch.build.targets.wheel.force-include]
"docs/agents.md" = "ynab_cli/agent-guide.md"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "packaging>=25,<27"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
